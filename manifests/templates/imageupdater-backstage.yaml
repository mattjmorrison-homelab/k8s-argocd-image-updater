apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: k8s-backstage
  namespace: argocd
spec:
  writeBackConfig:
    method: "argocd"
  applicationRefs:
    - namePattern: "k8s-backstage"
      images:
        - alias: "backstage"
          imageName: "registry.morrisons.site/app-backstage:v0.0.0"
          commonUpdateSettings:
            updateStrategy: "latest"
            pullSecret: "secret:argocd/argocd-image-updater-zot-creds#creds"
            # Critical, not optional: "latest" with no filter considers
            # every tag by creation time, tag name notwithstanding.
            # app-backstage's CI pushes unmerged PRs to pr-<sha> tags in
            # this same repository (build-once-then-retag-on-merge, see
            # app-backstage#4) -- without this, an unreviewed PR's
            # staging build could get deployed before it's ever
            # promoted to a real merge-triggered tag.
            ignoreTags:
              - "pr-*"
          manifestTargets:
            helm:
              name: "backend.image.repository"
              tag: "backend.image.tag"
