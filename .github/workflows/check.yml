name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mattjmorrison-homelab/actions-helm@73e6d2217352cf406eb45b6c917520f0e88071b2
        with:
          namespace: argocd
          service-account: argocd-image-updater-ci
